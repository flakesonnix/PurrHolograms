name: PurrHolograms
version: '0.1.0-alpha'
main: gay.nyaa.purrholograms.PurrHologramsPlugin
api-version: '1.21'
prefix: PurrHolograms
author: flakesonnix
description: Hologram framework with MiniMessage, PurrItems displays and in-game editor
depend: [PurrCore]
softdepend: [PurrItems]
commands:
  hologram:
    description: Manage holograms
    usage: /hologram <create|delete|list|tp|addline|additem|removeline|movehere|edit>
    aliases: [holo, ph]
    permission: purrholograms.use
    permission-message: You don't have permission!
permissions:
  purrholograms.use:
    description: Use hologram commands
    default: op
  purrholograms.admin:
    description: Delete and edit all holograms
    default: op
